# The pure, wasm-portable core shared by the native backend and the wasm
# frontend: the Todo/User domain, actions, the serde-derived JSON codec,
# and the oak view.
#
# Workspace-dependency note: the compiler at the pinned revision inherits
# PATH deps via `workspace = true` but not git deps (a git-inherited dep
# resolves to an empty lock and `unresolved module`). The git sources stay
# explicit here; the canonical copy also lives in the root
# `[workspace.dependencies]` for the future full conversion.
#
# The mote name is `todo_core` (an underscore) because a `use` head must be
# an identifier; the directory keeps the repo's hyphenated spelling like
# `todo-backend`.
[mote]
name = "todo_core"
version = "0.1.0"
edition = "2026"

[lib]
path = "src/lib.mo"

[dependencies.init]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "init"

[dependencies.std]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "std"

[dependencies.json]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/json"

[dependencies.oak]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/oak"

[dependencies.xml_html]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/xml_html"

[affine]
mode = "warn"
