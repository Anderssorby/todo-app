# The pure, wasm-portable core shared by the native backend and the wasm
# frontend: the Todo/User domain, actions, the hand-written JSON codec, the
# time/due formatting (`stamp.mo`), the Markdown renderer (`notes.mo`), and
# the oak view.
#
# Every dependency inherits the workspace root's `[workspace.dependencies]`
# (`workspace = true`), so this file no longer repeats the Monad revision.
# The workspace root's `mote.lock` is the one committed lock for all four
# members.
#
# The mote name is `todo_core` (an underscore) because a `use` head must be
# an identifier; the directory keeps the repo's hyphenated spelling like
# `todo-backend`.
[mote]
name = "todo_core"
version = "0.1.0"
edition = "2026"

[lib]
path = "src/lib.mo"

[dependencies.init]
workspace = true

[dependencies.std]
workspace = true

[dependencies.json]
workspace = true

[dependencies.oak]
workspace = true

[dependencies.xml_html]
workspace = true

# UTC ISO-8601 parsing/calendar conversion for the shared timestamp and
# due-date formatting. `parsec` is direct because `Stamp` matches
# `Date.parse_iso`'s `ParseResult` (a type from that mote, so a transitive
# dependency will not do).
[dependencies.time]
workspace = true

[dependencies.parsec]
workspace = true

# Markdown notes, rendered with the mote's safe defaults (raw HTML escaped,
# javascript:/vbscript:/file: URLs dropped). Pure and wasm-portable, so the
# native SSR view and the browser shell share one renderer.
[dependencies.markdown]
workspace = true

[affine]
mode = "warn"
