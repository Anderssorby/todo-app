# The browser SPA: a real oak_wasm Program (mount/dispatch/tick,
# diff/patch over the DOM). `targets = ["web"]` records that its code is
# only meaningful there (it reaches web_wasm's DOM/fetch/storage/console
# externs); availability is enforced per extern at codegen, same as
# `web_wasm`/`oak_wasm` themselves, so `monad check` still runs everywhere.
#
# Workspace-dependency note: the pinned compiler's `workspace = true`
# inheritance does not load a dependency's submodules (`todo_core::storage`
# is unresolved) and does not inherit git deps, so every source stays
# explicit here. The canonical copy lives in the root
# `[workspace.dependencies]` for the future full conversion.
#
# `[lib]` is the root for the component modules under `src/components/`;
# `[bin]` stays the wasm entry.
[mote]
name = "todo_spa"
version = "0.1.0"
edition = "2026"
targets = ["web"]

[lib]
path = "src/lib.mo"

[bin]
name = "todo-spa"
path = "src/main.mo"

[dependencies.init]
git = "https://github.com/monad-lang/monad.git"
rev = "a9d9a8115677546e41d89af923355b374817f897"
subdir = "init"

[dependencies.std]
git = "https://github.com/monad-lang/monad.git"
rev = "a9d9a8115677546e41d89af923355b374817f897"
subdir = "std"

[dependencies.todo_core]
path = "../todo-core"

[dependencies.oak]
git = "https://github.com/monad-lang/monad.git"
rev = "a9d9a8115677546e41d89af923355b374817f897"
subdir = "motes/oak"

[dependencies.oak_wasm]
git = "https://github.com/monad-lang/monad.git"
rev = "a9d9a8115677546e41d89af923355b374817f897"
subdir = "motes/oak_wasm"

[dependencies.web_wasm]
git = "https://github.com/monad-lang/monad.git"
rev = "a9d9a8115677546e41d89af923355b374817f897"
subdir = "motes/web_wasm"

# The pure event snapshot the drop handler reads (`WebEvent.data`).
[dependencies.web_event]
git = "https://github.com/monad-lang/monad.git"
rev = "a9d9a8115677546e41d89af923355b374817f897"
subdir = "motes/web_event"

# The typed-event ABI's C half (`web_event_*`, `dom_add_listener_global`)
# is pinned to the same Monad revision as the other motes; the installed
# nightly predates it. The manifest tier is how an external mote points the
# link at the pinned runtime instead of the toolchain's copy.
[dependencies.runtime]
git = "https://github.com/monad-lang/monad.git"
rev = "a9d9a8115677546e41d89af923355b374817f897"
subdir = "runtime"

[dependencies.xml_html]
git = "https://github.com/monad-lang/monad.git"
rev = "a9d9a8115677546e41d89af923355b374817f897"
subdir = "motes/xml_html"

[dependencies.json]
git = "https://github.com/monad-lang/monad.git"
rev = "a9d9a8115677546e41d89af923355b374817f897"
subdir = "motes/json"

# NOT `log` (motes/log): `Logger.log`'s `json_lines` match arm calls
# `Json.to_string`, which reaches the web-gated `F64.to_string` -- this
# makes the whole mote unreachable-unsafe on `wasm32-unknown-unknown`
# even when only `plain_text`/`Console.log` is used (filed as
# `log-mote-not-web-safe`).

[affine]
mode = "warn"
