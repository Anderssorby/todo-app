# Check and build the app with the PINNED Monad nightly.
#
# The image workflow (image.yml) uses the flake's pinned toolchain. This one
# installs the nightly named by MONAD_NIGHTLY below -- the same revision the
# motes and the flake are pinned to -- so the compiler can no longer run
# ahead of the motes (the exact skew behind
# `compiler-mote-revision-skew-is-not-diagnosed`, see PLAN.md). The nightly
# moves only by explicit bumps: MONAD_NIGHTLY, every mote.toml rev, the
# flake.nix input and the two lock files move together. This ends the
# `monadup default` chase, where the check-build job failed by design
# whenever the pin trailed the latest nightly -- that failure was the old
# compatibility signal, not a broken build. The boot-the-server step at the
# end still fails on a binary that links but cannot open SQLite.
name: nightly

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # After the Monad nightly cut; not on the hour to avoid the busiest slot.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The exact monadup tag this workflow installs: the pin for the CI compiler.
# Bumped explicitly, together with every `rev = "..."` in mote.toml, the
# flake.nix input (monad.url + monadRev) and both lock files -- never by
# following the latest nightly.
env:
  MONAD_NIGHTLY: nightly-2026-11-07-79aaa8e3

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm clang lld libgc-dev pkg-config libsqlite3-dev \
            zlib1g-dev libncurses-dev curl xz-utils nodejs
          # The compiler invokes bare `llc`/`clang`/`ld.lld`; Ubuntu's
          # versioned packages do not always provide those names.
          if ! command -v llc >/dev/null 2>&1; then
            llvm_bin="$(ls /usr/bin/llc-* 2>/dev/null | sort -V | tail -1)"
            [ -n "$llvm_bin" ] || { echo "no llc found" >&2; exit 1; }
            sudo ln -sf "$llvm_bin" /usr/local/bin/llc
          fi
          if ! command -v clang >/dev/null 2>&1; then
            clang_bin="$(ls /usr/bin/clang-* 2>/dev/null | sort -V | tail -1)"
            [ -n "$clang_bin" ] || { echo "no clang found" >&2; exit 1; }
            sudo ln -sf "$clang_bin" /usr/local/bin/clang
          fi
          if ! command -v ld.lld >/dev/null 2>&1; then
            lld_bin="$(ls /usr/bin/ld.lld-* 2>/dev/null | sort -V | tail -1)"
            [ -n "$lld_bin" ] || { echo "no ld.lld found" >&2; exit 1; }
            sudo ln -sf "$lld_bin" /usr/local/bin/ld.lld
          fi
          llc --version | head -1
          clang --version | head -1

      - name: Install wasi-sdk 34.0
        run: |
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz"
          curl -fsSL "$url" -o /tmp/wasi-sdk.tar.gz
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  /tmp/wasi-sdk.tar.gz" \
            | sha256sum -c -
          mkdir -p "$HOME/wasi-sdk"
          tar -xzf /tmp/wasi-sdk.tar.gz -C "$HOME/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$HOME/wasi-sdk" >> "$GITHUB_ENV"
          "$HOME/wasi-sdk/bin/clang" --version | head -1

      - name: Install Nix
        # Only used when no published nightly carries the pin yet (see the
        # selection step). The Cachix cache may already hold the compiler;
        # otherwise this bootstraps it once.
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install the pinned Monad nightly
        run: |
          curl -fsSL https://monad-lang.org/install | bash
          export PATH="$HOME/.monad/bin:$PATH"
          monadup install "$MONAD_NIGHTLY"
          monadup use "$MONAD_NIGHTLY"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          monad version
          monadup doctor

      # The compiler's runtime must match the pinned std/runtime: a mismatch
      # links and then misbehaves at runtime (see the boot step at the bottom).
      # Failing here means MONAD_NIGHTLY and the mote/flake pin drifted apart
      # -- bump every mote, the flake and MONAD_NIGHTLY together, never one
      # alone. A pin between nightlies (main ahead of the last release) is
      # not a mismatch: build the pinned compiler from the flake's own Monad
      # input and use that instead.
      - name: Select the pinned compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/check-toolchain.sh; then
            echo "$MONAD_NIGHTLY matches the mote pin"
            exit 0
          fi

          pin="$(grep -h '^rev = "' mote.toml | sed 's/^rev = "\(.*\)"$/\1/' | sort -u | tr -d '\n')"
          nightly="$(monad version | head -1 | awk '{print $1}')"
          # `compare` orders the pin against the installed nightly: "ahead"
          # means the nightly contains the pin and is NEWER, so the pin is
          # the thing to bump; "behind" means the nightly has not caught up
          # yet.
          status="$(gh api "repos/monad-lang/monad/compare/${pin}...${nightly}" --jq .status)"
          if [ "$status" != "behind" ]; then
            echo "the pinned nightly ($nightly) is $status the pin ($pin)" >&2
            echo "bump the mote/flake pin to the nightly and MONAD_NIGHTLY with it, instead of building the pin" >&2
            exit 1
          fi

          echo "no nightly carries $pin yet; building the pinned compiler"
          bin="$(nix build --accept-flake-config --no-link --print-out-paths \
            "github:monad-lang/monad/${pin}#monad")"
          src="$(nix flake prefetch --json "github:monad-lang/monad/${pin}" \
            | jq -r .storePath)"
          # Put the pinned compiler first; `$PATH` already names the nightly.
          # Use the unwrapped binary (`bin/monad` is wrapped with the flake's
          # own clang/glibc; here the job's apt toolchain is the consistent
          # one, exactly as the monadup nightly uses it).
          echo "PATH=$bin/share/monad:$PATH" >> "$GITHUB_ENV"
          # The bare compiler finds init/std/llvm/runtime here.
          echo "MONAD_ROOT=$src" >> "$GITHUB_ENV"
          echo "MONAD_HOME=$HOME/.monad" >> "$GITHUB_ENV"
          test "$("$bin/share/monad/monad" version | head -1 | awk '{print $1}')" = "${pin:0:7}"

      - name: Fetch pinned motes
        run: |
          # The one network step; the build/test steps then run --locked.
          scripts/fetch-deps.sh

      - name: Check and test
        run: |
          monad check --workspace --locked
          # `--workspace` expands the members but not the root script module.
          monad check start.mo
          # Directory arguments deliberately, not --workspace: the SPA is a
          # web-only target with no native tests.
          monad test --locked todo-core/src todo-backend/src todo-webgen/src

      - name: Build
        run: |
          monad build --locked todo-backend
          monad build --locked --target wasm32-unknown-unknown todo-spa -o "$PWD/web/app.wasm"
          monad build --locked todo-webgen
          ./target/debug/todo-webgen

      - name: Loader and SPA tests
        run: |
          node web/boot_url.test.mjs
          node web/runtime_args.test.mjs
          # --stack-size: the 701-item large-response check renders a patch
          # deep enough to overflow this runner's apt Node 18 (V8 10) where
          # the dev shell's Node 24 has headroom; deep wasm frames count
          # against the same JS stack.
          node --stack-size=4000 web/smoke.mjs "$PWD/web/app.wasm"
          # A 401 from /api/me must show the sign-in view, not a broken page.
          SMOKE_UNAUTH=1 node --stack-size=4000 web/smoke.mjs "$PWD/web/app.wasm"

      # A binary that links but cannot open a SQLite database must fail the
      # build here, not in production. On 2026-10-29, under the
      # `monadup default` chase, a compiler newer than the pinned motes
      # produced a backend that segfaulted inside `sqlite3_open_v2` while
      # every
      # check, test and build above passed (see PLAN.md,
      # `compiler-mote-revision-skew-is-not-diagnosed`).
      - name: Boot the server and exercise SQLite
        run: |
          db_dir="$(mktemp -d)"
          db="$db_dir/todos.db"
          trap 'kill "$server" 2>/dev/null || true' EXIT

          # Production mode first: unauthenticated requests are rejected.
          ./target/debug/todo-backend --port 8095 --db "$db" &
          server=$!

          # `if` keeps a not-yet-listening connection from tripping `set -e`.
          ready=0
          for _ in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:8095/login; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" = 1

          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8095/api/todos)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8095/)" = 302
          # The login page offers the ATproto handle form, and the client
          # metadata document the authorization server fetches is served.
          curl -fsS http://127.0.0.1:8095/login | grep -q 'action="/auth/login"'
          curl -fsS http://127.0.0.1:8095/client-metadata.json \
            | grep -q '"dpop_bound_access_tokens":true'

          kill "$server"
          wait "$server" || true

          # The full ATproto OAuth flow against a local stub authorization
          # server: PAR, DPoP proofs (verified server-side by the stub),
          # token exchange, PDS session confirmation, app session cookie.
          node web/auth-smoke.mjs "$PWD/target/debug/todo-backend" 8096

          # Then the dev stub, which makes every request the local dev user
          # (no IdP needed) so the transactional SQLite path runs for real.
          TODO_DEV_AUTH=1 ./target/debug/todo-backend --port 8095 --db "$db" &
          server=$!

          ready=0
          for _ in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:8095/login; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" = 1

          curl -fsS http://127.0.0.1:8095/api/me | grep -q '"user"'
          # A new user starts at UTC; the offset update is validated and
          # echoed by POST /api/me.
          curl -fsS http://127.0.0.1:8095/api/me | grep -q '"utc_offset_minutes":0'
          curl -fsS -X POST http://127.0.0.1:8095/api/me \
            -H 'content-type: application/json' \
            -d '{"utc_offset_minutes":120}' | grep -q '"utc_offset_minutes":120'
          # An invalid offset is a client error, not a stored value.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8095/api/me -H 'content-type: application/json' \
            -d '{"utc_offset_minutes":7}')" = 400

          # A fresh database migrates to an EMPTY shared workspace.
          test "$(curl -fsS http://127.0.0.1:8095/api/todos)" = "[]"

          # One add through the transactional load → apply → rewrite path,
          # then read it back through a fresh connection. Timestamps are
          # ISO-8601 UTC (migration 2 normalises them).
          curl -fsS -X POST http://127.0.0.1:8095/api/actions \
            -H 'content-type: application/json' \
            -d '{"type":"add","title":"ci","notes":"n","group":"g","tags":["a"],"due_at":"2026-11-01"}' \
            | grep -q '"title":"ci"'
          todos="$(curl -fsS http://127.0.0.1:8095/api/todos)"
          printf '%s' "$todos" | grep -q '"due_at":"2026-11-01"'
          printf '%s' "$todos" | grep -Eq '"created_at":"[0-9T:-]+Z"'
          # An invalid due date is rejected before it reaches the row.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8095/api/actions -H 'content-type: application/json' \
            -d '{"type":"add","title":"bad","due_at":"2026-13-01"}')" = 400

          # Regression: idle keep-alive sockets must not park the accept loop.
          # moon's `Server.serve_concurrent` awaited its whole batch, so a
          # browser's idle sockets stopped the SPA's `app.wasm` fetch (the
          # intermittent "failed to mount / NetworkError"). See
          # `todo-backend/src/serve.mo` and PLAN.md,
          # `moon-serve-concurrent-parks-accept-loop`.
          node web/keepalive.test.mjs http://127.0.0.1:8095 24 /web/app.wasm

          kill "$server"
          wait "$server" || true
