# Virtual workspace root for the todo-app repository: no [mote] of its
# own, just the member list and the shared dependency sources.
#
# `[workspace.dependencies]` below is the canonical source list. The pinned
# compiler's `workspace = true` inheritance cannot be used by the members
# yet (re-tested at 6a59e090, 2026-10-30): a path dependency no longer hangs,
# but it resolves the dependency ROOT without its submodules
# (`Todo`/`Status`/`Stamp.*` are unknown in the SPA), and an inherited git
# dependency writes an empty `mote.lock` (0 entries). The members therefore
# keep explicit sources; this table is the one copy to switch them to when
# that lands.
# The Monad motes are pinned to the same public revision in every source,
# and every build/check/test runs `--locked` (the per-member `mote.lock`
# files are committed).
#
# Sub-table headers, not inline tables: both readers accept either, but
# this is the Monad corpus's house style and the form the rest of this
# repo already uses.

[workspace]
members = [
  "todo-core",
  "todo-backend",
  "todo-spa",
  "todo-webgen",
]

[workspace.dependencies.init]
git = "https://github.com/monad-lang/monad.git"
rev = "6a59e0909cbc35ba1607061f7926d4347baf6f31"
subdir = "init"

[workspace.dependencies.std]
git = "https://github.com/monad-lang/monad.git"
rev = "6a59e0909cbc35ba1607061f7926d4347baf6f31"
