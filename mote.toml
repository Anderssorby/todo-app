# Virtual workspace root for the todo-app repository: no [mote] of its
# own, just the member list and the shared dependency sources.
#
# `[workspace.dependencies]` below is the single source of truth: every
# member declares `workspace = true` and inherits from it, including the
# root-relative `todo_core` path. The compiler resolves inheritance at
# a4d8fde7 (PR #149), and `monad fetch` writes ONE root `mote.lock` for the
# whole workspace (the per-member locks are gone).
# The Monad motes are pinned to the same public revision in every source,
# and every build/check/test runs `--locked`. The root lock is committed;
# each member's `mote.lock` is a committed symlink to it (the per-member
# verify path still reads `<member>/mote.lock`; see README.md and PLAN.md).
#
# Sub-table headers, not inline tables: both readers accept either, but
# this is the Monad corpus's house style and the form the rest of this
# repo already uses.

[workspace]
members = [
  "todo-core",
  "todo-backend",
  "todo-spa",
  "todo-webgen",
]

[workspace.dependencies.init]
git = "https://github.com/monad-lang/monad.git"
rev = "a4d8fde74d2e4148c424b336b87624133f08cba6"
subdir = "init"

[workspace.dependencies.std]
git = "https://github.com/monad-lang/monad.git"
rev = "a4d8fde74d2e4148c424b336b87624133f08cba6"
