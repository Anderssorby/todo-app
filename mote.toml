# The typed-event ABI's C half, linked into the wasm build.
[workspace.dependencies.runtime]
git = "https://github.com/monad-lang/monad.git"
rev = "e96b18ae14be57b1c361b441662809f3f76205a0"
subdir = "runtime"

# The ATproto sign-in consumes the oauth mote's transport seam, PKCE and
# error type (`OauthHttp`, `Pkce`, `OauthError`); its OIDC login/bearer
# handlers do not fit ATproto and stay unused — and with them the crypto
# imports behind them: no crypto module enters the backend's compile
# closure, which is what keeps dpop.mo's extern set legal (see the
# crypto entry below).
[workspace.dependencies.oauth]
git = "https://github.com/monad-lang/monad.git"
rev = "e96b18ae14be57b1c361b441662809f3f76205a0"
subdir = "motes/oauth"

# The pinned declaration of the libcrypto the backend's own DPoP FFI
# (`todo-backend/src/dpop.mo`) links against. No app module imports
# `crypto::` while `dpop.mo`'s externs exist -- `crypto::ffi` declares
# fifteen of the same C symbols, and one binary cannot declare a C symbol
# twice. `todo-backend/mote.toml` carries the `[link]` flags itself.
[workspace.dependencies.crypto]
git = "https://github.com/monad-lang/monad.git"
rev = "e96b18ae14be57b1c361b441662809f3f76205a0"
subdir = "motes/crypto"

# The intra-repo shared core (path relative to this workspace root).
[workspace.dependencies.todo_core]
path = "todo-core"
