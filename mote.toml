# Virtual workspace root for the todo-app repository: no [mote] of its
# own, just the member list and the shared dependency sources.
#
# Every member declares its dependencies with `workspace = true`; the
# source (git pin + subdir, or the intra-repo path) lives exactly once in
# `[workspace.dependencies]` below. The Monad motes are pinned to the same
# public revision in every source, and every build/check/test runs
# `--locked` (the per-member `mote.lock` files are committed).
#
# Sub-table headers, not inline tables: both readers accept either, but
# this is the Monad corpus's house style and the form the rest of this
# repo already uses.

[workspace]
members = [
  "todo-core",
  "todo-backend",
  "todo-spa",
  "todo-webgen",
]

[workspace.dependencies.init]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "init"

[workspace.dependencies.std]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
