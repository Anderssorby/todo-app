# One replica only: SQLite is a local file with a WAL, not a shared database.
# The backend's transactions serialize writers inside the pod, but two pods
# must not open the same database on a ReadWriteOnce PVC. Recreate + RWO is
# still required; a multi-replica deployment needs a real database.
apiVersion: v1
kind: Namespace
metadata:
  name: todo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-state
  namespace: todo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  # storageClassName: standard   # set this if the cluster has no default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: todo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: todo-app
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: todo-app
          image: ghcr.io/anderssorby/todo-app:latest
          imagePullPolicy: Always
          args: ["--port", "8095", "--db", "/state/todos.db"]
          ports:
            - name: http
              containerPort: 8095
              protocol: TCP
          readinessProbe:
            # Validates the generated loader asset as well as the HTTP loop.
            httpGet:
              path: /web/boot.js
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            # `/api/todos` is 401 in production (sign-in is deferred), so a
            # 2xx probe must target a public route; `/login` exercises the
            # router without touching the database.
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: todo-state
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: todo-app
  namespace: todo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: todo-app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
