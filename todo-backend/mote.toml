# The native backend: moon HTTP server, SQLite persistence, users/sessions
# and the SSR/oak pages.
#
# Workspace-dependency note (re-tested at 6a59e090, 2026-10-30): a
# `workspace = true` path dep no longer hangs but still does not load its
# submodules, and an inherited git dep writes an empty lock, so every source
# stays explicit here. The canonical copy lives in
# the root `[workspace.dependencies]` for the future full conversion.
#
# The `sql`/`sqlite` driver is `#[extern "c"]`/compiled-backend-only, so it
# is a backend dependency and never `todo-core` (which is also compiled for
# wasm). The compiler's `lang` mote is not a dependency of this app.
[mote]
name = "todo-backend"
version = "0.1.0"
edition = "2026"

[lib]
path = "src/lib.mo"

[bin]
name = "todo-backend"
path = "src/main.mo"

[dependencies.std]
git = "https://github.com/monad-lang/monad.git"
rev = "6a59e0909cbc35ba1607061f7926d4347baf6f31"
subdir = "std"

[dependencies.json]
git = "https://github.com/monad-lang/monad.git"
rev = "6a59e0909cbc35ba1607061f7926d4347baf6f31"
subdir = "motes/json"

[dependencies.todo_core]
path = "../todo-core"

[dependencies.moon]
git = "https://github.com/monad-lang/monad.git"
rev = "6a59e0909cbc35ba1607061f7926d4347baf6f31"
subdir = "motes/moon"

[dependencies.http]
git = "https://github.com/monad-lang/monad.git"
rev = "6a59e0909cbc35ba1607061f7926d4347baf6f31"
subdir = "motes/http"

[dependencies.log]
git = "https://github.com/monad-lang/monad.git"
rev = "6a59e0909cbc35ba1607061f7926d4347baf6f31"
subdir = "motes/log"

[dependencies.clap]
git = "https://github.com/monad-lang/monad.git"
rev = "6a59e0909cbc35ba1607061f7926d4347baf6f31"
subdir = "motes/clap"

[dependencies.sql]
git = "https://github.com/monad-lang/monad.git"
rev = "6a59e0909cbc35ba1607061f7926d4347baf6f31"
subdir = "motes/sql"

[dependencies.sqlite]
git = "https://github.com/monad-lang/monad.git"
rev = "6a59e0909cbc35ba1607061f7926d4347baf6f31"
subdir = "motes/sqlite"

[affine]
mode = "warn"
