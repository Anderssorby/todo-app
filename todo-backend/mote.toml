[mote]
name = "todo-backend"
version = "0.1.0"
edition = "2026"

[lib]
path = "src/lib.mo"

[bin]
name = "todo-backend"
path = "src/main.mo"

[dependencies.std]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "std"

# `json` replaced `lang::json` when JSON was extracted out of the compiler
# into its own mote (2026-10-19). The compiler's `lang` mote is no longer a
# dependency of this app.
[dependencies.json]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/json"

# The shared pure core: Todo/Storage, Action, the JSON codec, and the oak
# view. The backend keeps only the HTTP and file-I/O layers.
[dependencies.todo_core]
path = "../todo-core"

[dependencies.moon]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/moon"

[dependencies.http]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/http"

[dependencies.log]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/log"

# The CLI arg parser: --port/-p and the auto-generated --help/-h.
[dependencies.clap]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/clap"

[affine]
mode = "warn"
