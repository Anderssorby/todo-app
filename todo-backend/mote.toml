# The native backend: moon HTTP server, SQLite persistence, users/sessions
# and the SSR/oak pages.
#
# Workspace-dependency note: the pinned compiler's `workspace = true`
# inheritance does not load a dependency's submodules (`todo_core::storage`
# is unresolved) and does not inherit git deps (they resolve to an empty
# lock), so every source stays explicit here. The canonical copy lives in
# the root `[workspace.dependencies]` for the future full conversion.
#
# The `sql`/`sqlite` driver is `#[extern "c"]`/compiled-backend-only, so it
# is a backend dependency and never `todo-core` (which is also compiled for
# wasm). The compiler's `lang` mote is not a dependency of this app.
[mote]
name = "todo-backend"
version = "0.1.0"
edition = "2026"

[lib]
path = "src/lib.mo"

[bin]
name = "todo-backend"
path = "src/main.mo"

[dependencies.std]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "std"

[dependencies.json]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/json"

[dependencies.todo_core]
path = "../todo-core"

[dependencies.moon]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/moon"

[dependencies.http]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/http"

[dependencies.log]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/log"

[dependencies.clap]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/clap"

[dependencies.sql]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/sql"

[dependencies.sqlite]
git = "https://github.com/monad-lang/monad.git"
rev = "12b74e927bed6e149b9f2668f62bbf5e856d031c"
subdir = "motes/sqlite"

[affine]
mode = "warn"
