# The native backend: moon HTTP server, SQLite persistence, users/sessions
# and the SSR/oak pages.
#
# Every dependency inherits the workspace root's `[workspace.dependencies]`
# (`workspace = true`), so this file no longer repeats the Monad revision.
# The root-relative `todo_core` path is inherited the same way; the workspace
# root's `mote.lock` is the one committed lock for all four members.
#
# The `sql`/`sqlite` driver is `#[extern "c"]`/compiled-backend-only, so it
# is a backend dependency and never `todo-core` (which is also compiled for
# wasm). The compiler's `lang` mote is not a dependency of this app.
[mote]
name = "todo-backend"
version = "0.1.0"
edition = "2026"

[lib]
path = "src/lib.mo"

[bin]
name = "todo-backend"
path = "src/main.mo"

[dependencies.std]
workspace = true

[dependencies.json]
workspace = true

[dependencies.todo_core]
workspace = true

[dependencies.moon]
workspace = true

[dependencies.http]
workspace = true

[dependencies.log]
workspace = true

[dependencies.clap]
workspace = true

[dependencies.sql]
workspace = true

[dependencies.sqlite]
workspace = true

# ATproto sign-in: oauth's `OauthHttp`/`Pkce`/`OauthError` seams. The DPoP
# signer itself is the app-local FFI in `src/dpop.mo`, so THIS mote owns
# its link flags: `-lcrypto` is declared here, not inherited from the
# `crypto` mote (no module here may `use` a `crypto::` module while
# `dpop.mo`'s externs exist, because `crypto::ffi` declares fifteen of
# the same C symbols and one binary cannot declare a symbol twice).
[dependencies.oauth]
workspace = true

[dependencies.crypto]
workspace = true

# The `dpop.mo` externs resolve against the system libcrypto; the
# pkg-config lookup finds the devshell's openssl `-L` (the tls mote's
# convention, see `motes/crypto/mote.toml`).
[link]
libs = ["crypto"]
pkg-config = ["openssl"]

[affine]
mode = "warn"
